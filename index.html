<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Ironmonger Deck 3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Silkscreen:wght@400;700&display=swap">
<style>
/* Layout: one cabinet column. Picture on top, text window under it (the Snatcher arrangement), pad at the bottom. */
:root{
  color-scheme: dark;
  --void:#07090f;      /* page ground, space outside the hull */
  --hull:#111727;      /* panels */
  --steel:#2b3654;     /* borders, idle controls */
  --plate:#8e9ab4;     /* secondary text */
  --ink:#e8ebf4;       /* primary text */
  --amber:#f0a63a;     /* the one accent: hazard paint, speaker names, A button */
  --teal:#5fd6c8;      /* live systems */
  --window:#0b1130;    /* text window fill */
  --font-display:"Silkscreen","Courier New",monospace;
  --font-text:"DotGothic16","MS Gothic","Osaka-Mono","Courier New",monospace;
}
html,body{height:100%}
body{
  background:var(--void); color:var(--ink);
  font-family:var(--font-text); font-size:16px; line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px;
  box-sizing:border-box;
  -webkit-user-select:none; user-select:none;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}
.app{
  max-width:760px; margin:0 auto; min-height:100%;
  display:flex; flex-direction:column; gap:8px; align-items:center;
}
.bar{
  width:100%; display:flex; align-items:center; gap:10px;
  font-family:var(--font-display); font-size:12px; letter-spacing:.08em;
}
.logo{color:var(--amber); font-weight:700}
.loc{color:var(--plate); flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chip{
  font:inherit; color:var(--plate); background:transparent;
  border:1px solid var(--steel); padding:4px 8px; cursor:pointer;
}
.chip[aria-pressed="true"]{color:var(--teal); border-color:var(--teal)}
.screen{
  width:min(100%, max(220px, calc((100vh - 27rem) * 4 / 3)));
  width:min(100%, max(220px, calc((100dvh - 27rem) * 4 / 3)));
  aspect-ratio:4/3; max-width:100%;
  border:2px solid var(--steel); background:#000; box-sizing:border-box;
}
canvas{display:block; width:100%; height:100%; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:manipulation}
.tw{
  width:100%; box-sizing:border-box; min-height:13rem;
  background:var(--window); border:2px solid var(--ink); outline:2px solid var(--window); outline-offset:-5px;
  padding:10px 14px; position:relative;
  display:flex; flex-direction:column; gap:6px;
}
.tw-who{font-family:var(--font-display); font-size:12px; letter-spacing:.08em; color:var(--amber); min-height:1em}
.tw-line{margin:0; min-height:2.9em; white-space:pre-wrap}
.tw-line.dim{color:var(--plate)}
.tw-more{position:absolute; right:12px; bottom:6px; color:var(--amber); animation:bob 0.8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){.tw-more{animation:none}}
.tw-menu{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:6px}
.tw-menu.three{grid-template-columns:repeat(3, minmax(0,1fr))}
.tw-menu button{
  font-family:var(--font-text); font-size:15px; color:var(--ink); text-align:left;
  background:transparent; border:1px solid var(--steel); padding:6px 8px; cursor:pointer; min-width:0;
}
.tw-menu button::before{content:"  "; white-space:pre}
.tw-menu button.on{border-color:var(--amber); color:var(--amber)}
.tw-menu button.on::before{content:"▶ "}
.tw-menu button.verb{font-family:var(--font-display); font-size:11px; letter-spacing:.04em; color:var(--plate); text-align:center; padding-inline:2px}
.tw-menu button.verb::before, .tw-menu button.verb.on::before{content:none}
.tw-menu button.verb[aria-pressed="true"]{background:var(--steel); color:var(--ink)}
.tw-menu button.wide{grid-column:1/-1}
.kp{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.kp-digits{display:flex; gap:6px}
.kp-col{display:flex; flex-direction:column; align-items:center; gap:2px}
.kp-col button{font:inherit; color:var(--plate); background:transparent; border:1px solid var(--steel); width:2.4rem; height:1.5rem; line-height:1; cursor:pointer}
.kp-d{font-family:var(--font-display); font-size:22px; width:2.4rem; text-align:center; border:1px solid var(--steel); background:#000; color:var(--teal); font-variant-numeric:tabular-nums}
.kp-col.sel .kp-d{border-color:var(--amber); color:var(--amber)}
.kp-act{display:flex; flex-direction:column; gap:6px; flex:1; min-width:6rem}
.kp-act button{font-family:var(--font-display); font-size:12px; letter-spacing:.08em; color:var(--ink); background:transparent; border:1px solid var(--steel); padding:8px; cursor:pointer}
.kp-act button.go{border-color:var(--amber); color:var(--amber)}
.pad{width:100%; display:flex; align-items:center; justify-content:space-between; gap:12px}
.dpad{
  width:8.5rem; height:8.5rem; position:relative; touch-action:none; flex:none;
  background:
    linear-gradient(var(--steel),var(--steel)) center/34% 100% no-repeat,
    linear-gradient(var(--steel),var(--steel)) center/100% 34% no-repeat;
}
.dpad::after{content:""; position:absolute; inset:38%; background:var(--hull)}
.dpad i{position:absolute; width:0; height:0; border:7px solid transparent}
.dpad .u{top:10px; left:calc(50% - 7px); border-bottom-color:var(--plate); border-top:0}
.dpad .d{bottom:10px; left:calc(50% - 7px); border-top-color:var(--plate); border-bottom:0}
.dpad .l{left:10px; top:calc(50% - 7px); border-right-color:var(--plate); border-left:0}
.dpad .r{right:10px; top:calc(50% - 7px); border-left-color:var(--plate); border-right:0}
.keys{font-size:13px; color:var(--plate); text-align:center; flex:1; min-width:0}
@media (pointer: coarse){.keys{visibility:hidden}}
.btns{display:flex; gap:12px; align-items:flex-end; flex:none}
.btns button{
  font-family:var(--font-display); font-weight:700; font-size:18px;
  width:4rem; height:4rem; border-radius:50%; cursor:pointer; touch-action:none;
  border:2px solid var(--steel); background:var(--hull); color:var(--plate);
}
.btns #bA{border-color:var(--amber); color:var(--amber); margin-bottom:1.5rem}
.btns button:active, .btns button.down{background:var(--steel)}
button:focus-visible{outline:2px solid var(--teal); outline-offset:2px}
</style>

<div class="app">
  <header class="bar">
    <span class="logo">IRONMONGER</span>
    <span class="loc" id="loc">DECK 3</span>
    <button class="chip" id="vr" aria-pressed="false">Enter VR</button>
    <button class="chip" id="snd" aria-pressed="false">Sound off</button>
  </header>
  <div class="screen"><canvas id="cv" width="384" height="288" aria-label="Game picture"></canvas></div>
  <section class="tw" id="tw" aria-live="polite">
    <div class="tw-who" id="who"></div>
    <p class="tw-line" id="line"></p>
    <div id="menu"></div>
    <span class="tw-more" id="more" hidden>▼</span>
  </section>
  <div class="pad">
    <div class="dpad" id="dpad" aria-label="Direction pad"><i class="u"></i><i class="d"></i><i class="l"></i><i class="r"></i></div>
    <div class="keys">Arrows or WASD to move<br>Z or Enter is A<br>X or Esc is B</div>
    <div class="btns"><button id="bB" aria-label="B, back">B</button><button id="bA" aria-label="A, act">A</button></div>
  </div>
</div>

<script>
(function(){
"use strict";
const W=384,H=288,T=32;
const cv=document.getElementById('cv'), G=cv.getContext('2d');
G.imageSmoothingEnabled=false;
const $=id=>document.getElementById(id);
const elWho=$('who'), elLine=$('line'), elMenu=$('menu'), elMore=$('more'), elLoc=$('loc'), elTw=$('tw');

/* ---------- helpers ---------- */
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c;};
const R=(g,c,x,y,w,h)=>{g.fillStyle=c;g.fillRect(x,y,w,h);};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
function h2(x,y){let n=Math.imul(x,374761393)+Math.imul(y,668265263);n=Math.imul(n^(n>>>13),1274126177);return ((n^(n>>>16))>>>0)/4294967296;}
function poly(g,pts,fill){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();if(fill){g.fillStyle=fill;g.fill();}}
function dith(g,x,y,w,h,c1,c2,horiz){
  R(g,c1,x,y,w,h); g.fillStyle=c2;
  for(let py=y;py<y+h;py++)for(let px=x;px<x+w;px++){
    const t=horiz?(px-x)/w:(py-y)/h;
    if(t>(BAYER[(py&3)*4+(px&3)]+.5)/16)g.fillRect(px,py,1,1);
  }
}
function dpoly(g,pts,c1,c2,horiz){
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  pts.forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});
  g.save();poly(g,pts);g.clip();dith(g,x0,y0,x1-x0,y1-y0,c1,c2,horiz);g.restore();
}

/* ---------- the deck ---------- */
const MAP=[
"##########################",
"##########################",
"##W##W###D###V##W##L##S###",
"#........................#",
"#..c..R......,,,,........#",
"#............,,,,.....cc.#",
"#........................#",
"#######....###############",
"####V##....##W##S#########",
"#.................########",
"#..b.....T.....c..########",
"#.................########",
"##########################"];
const MW=MAP[0].length, MH=MAP.length;
const tile=(x,y)=>(y<0||y>=MH||x<0||x>=MW)?'#':MAP[y][x];
const isWall=c=>'#WVSDL'.includes(c);
const isFloor=c=>c==='.'||c===',';
const isFace=(x,y)=>isWall(tile(x,y))&&!isWall(tile(x,y+1));

const P={floorA:'#59627a',floorB:'#525b72',floorHi:'#6f7a94',floorLo:'#3d4458',
  wall:'#3a4864',wallHi:'#5c6f92',wallLo:'#283349',skirt:'#1d2535',top:'#111724',topTrim:'#2c3854',
  amber:'#f0a63a',teal:'#5fd6c8'};
const TI={};
function buildTiles(){
  const floor=(base,seed)=>{const c=mk(T,T),g=c.getContext('2d');
    R(g,base,0,0,T,T);R(g,P.floorHi,0,0,T,1);R(g,P.floorHi,0,0,1,T);R(g,P.floorLo,0,T-1,T,1);R(g,P.floorLo,T-1,0,1,T);
    [[3,3],[27,3],[3,27],[27,27]].forEach(([x,y])=>{R(g,P.floorLo,x,y,2,2);R(g,P.floorHi,x,y,1,1);});
    for(let i=0;i<5;i++){const x=6+Math.floor(h2(i,seed)*18),y=6+Math.floor(h2(seed,i+9)*20);R(g,'rgba(30,36,52,.35)',x,y,2+Math.floor(h2(i,seed+3)*5),1);}
    return c;};
  TI.fa=floor(P.floorA,1);TI.fb=floor(P.floorB,2);
  {const c=mk(T,T),g=c.getContext('2d');R(g,'#272d3b',0,0,T,T);
    for(let y=3;y<28;y+=6)for(let x=2;x<28;x+=7){R(g,'#0f1219',x,y,5,3);R(g,'#3b4458',x,y+3,5,1);}
    R(g,'#3b4458',0,0,T,1);R(g,'#171b25',0,T-1,T,1);TI.gr=c;}
  const face=()=>{const c=mk(T,T),g=c.getContext('2d');
    R(g,P.wall,0,0,T,T);R(g,P.wallHi,0,0,T,2);R(g,P.wallLo,0,2,T,1);
    R(g,P.wallLo,15,4,1,20);R(g,P.wallHi,16,4,1,20);R(g,P.wallLo,31,4,1,20);R(g,P.wallHi,0,4,1,20);
    R(g,P.skirt,0,24,T,8);R(g,P.amber,0,24,T,1);R(g,'#0d111a',0,31,T,1);
    return c;};
  TI.face=face();
  {const c=face(),g=c.getContext('2d');R(g,P.wallLo,4,5,24,16);R(g,P.wallHi,4,5,24,1);R(g,'#03050a',6,7,20,12);TI.faceW=c;}
  {const c=face(),g=c.getContext('2d');R(g,P.wallLo,7,6,18,14);for(let y=8;y<19;y+=3)R(g,'#0d111a',9,y,14,2);TI.faceV=c;}
  {const c=face(),g=c.getContext('2d');R(g,'#0d111a',4,5,24,15);R(g,P.amber,5,6,22,13);
    g.fillStyle='#1a1408';g.font='700 8px Silkscreen, "Courier New", monospace';g.textBaseline='top';g.fillText('DK3',7,8);TI.faceS=c;}
  {const c=face(),g=c.getContext('2d');R(g,'#0d111a',3,2,26,30);
    R(g,'#7786a3',5,4,11,28);R(g,'#6a7894',16,4,11,28);R(g,'#99a8c4',5,4,11,1);R(g,'#99a8c4',16,4,11,1);R(g,'#99a8c4',5,4,1,28);
    R(g,'#0d111a',15,4,2,28);R(g,'#1b2233',8,9,5,8);R(g,'#1b2233',19,9,5,8);
    R(g,P.amber,6,26,9,2);R(g,P.amber,17,26,9,2);
    g.fillStyle='#e8ebf4';g.font='8px Silkscreen, "Courier New", monospace';g.textBaseline='top';g.fillText('03',9,18);
    TI.faceD=c;}
  {const c=face(),g=c.getContext('2d');R(g,P.amber,2,1,28,31);R(g,'#0d111a',4,3,24,29);
    R(g,'#55627e',5,4,22,28);R(g,'#7786a3',5,4,22,1);R(g,'#0d111a',15,4,2,28);
    R(g,P.amber,14,8,4,1);R(g,P.amber,13,9,6,1);R(g,P.amber,12,10,8,1);R(g,P.amber,15,11,2,4);
    g.fillStyle='#e8ebf4';g.font='8px Silkscreen, "Courier New", monospace';g.textBaseline='top';g.fillText('BR',9,19);
    TI.faceL=c;}
  {const c=mk(T,T),g=c.getContext('2d');R(g,P.top,0,0,T,T);
    for(let i=0;i<14;i++)R(g,'#161d2c',Math.floor(h2(i,5)*30),Math.floor(h2(5,i)*30),2,1);TI.top=c;}
  // objects (drawn bottom-anchored on their tile)
  {const c=mk(32,44),g=c.getContext('2d');
    R(g,'#0c0f17',1,3,30,41);R(g,'#b07a44',2,4,28,10);R(g,'#c9925a',2,4,28,1);R(g,'#8a5a30',2,9,28,1);
    R(g,'#7d4d2b',2,14,28,29);R(g,'#5e381e',2,22,28,1);R(g,'#5e381e',2,32,28,1);R(g,'#5e381e',10,14,1,29);R(g,'#5e381e',21,14,1,29);
    R(g,P.amber,13,25,6,5);R(g,'#7d4d2b',15,26,2,3);TI.crate=c;}
  {const c=mk(32,48),g=c.getContext('2d');
    R(g,'#0c0f17',2,3,28,45);R(g,'#39425a',3,4,26,6);R(g,'#4c5876',3,4,26,1);
    R(g,'#2a3146',3,10,26,37);R(g,'#07090f',6,13,20,15);R(g,'#1a2030',6,13,20,1);
    R(g,'#4c5876',4,31,24,5);R(g,'#1a2030',6,32,20,1);R(g,'#1a2030',6,34,20,1);
    R(g,'#07090f',12,39,8,5);R(g,'#1d2535',3,45,26,2);TI.term=c;}
  {const c=mk(32,40),g=c.getContext('2d');
    R(g,'#0c0f17',1,6,30,34);R(g,'#2f6f73',2,7,28,14);R(g,'#3f8b8f',2,7,28,2);R(g,'#235357',15,9,2,12);
    R(g,'#2a6064',2,21,28,11);R(g,'#3f8b8f',2,21,28,1);R(g,'#1d2535',3,32,5,7);R(g,'#1d2535',24,32,5,7);TI.bench=c;}
}

/* ---------- state ---------- */
const S={mode:'explore',flags:{talked:false,cell:false,lockerOpen:false,powered:false,dest:null},
  p:{x:3*T+16,y:5*T+24,dir:'down',fr:0,ft:0,moving:false},
  verb:'look',hi:null,scene:'cabin',sm:{level:'sector',sys:0,sel:0,z:0,m:[1,0,0,0,1,0,0,0,1]},fade:0,fadeDir:0,fadeFn:null,doorCool:0,termT:0,kp:{d:[0,0,0,0],sel:0},focus:0};
let dlg=null;

/* ---------- sound ---------- */
let AC=null,soundOn=false;
function beep(f,d,type,vol){
  if(!soundOn||!AC)return;
  try{const o=AC.createOscillator(),v=AC.createGain();o.type=type||'square';o.frequency.value=f;
    v.gain.setValueAtTime(vol||.04,AC.currentTime);v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
    o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}
}
$('snd').addEventListener('click',()=>{
  soundOn=!soundOn;
  if(soundOn&&!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){soundOn=false;}}
  if(AC&&AC.state==='suspended')AC.resume();
  $('snd').setAttribute('aria-pressed',soundOn);$('snd').textContent=soundOn?'Sound on':'Sound off';
  beep(660,.08);
});

/* ---------- text window ---------- */
function say(lines,cb){dlg={lines,i:0,n:0,cb:cb||null};S.hi=null;paintDlg();}
function paintDlg(){
  const [who,text]=dlg.lines[dlg.i];
  elWho.textContent=who||'';elLine.className='tw-line';elLine.textContent=text.slice(0,Math.floor(dlg.n));
  elMenu.innerHTML='';elMenu.className='';elMore.hidden=dlg.n<text.length;
}
function advance(){
  if(!dlg)return;
  const text=dlg.lines[dlg.i][1];
  if(dlg.n<text.length){dlg.n=text.length;paintDlg();return;}
  beep(520,.05);
  if(++dlg.i<dlg.lines.length){dlg.n=0;paintDlg();return;}
  const cb=dlg.cb;dlg=null;elMore.hidden=true;
  if(cb)cb(); if(!dlg)refreshUI();
}
function objective(){
  const f=S.flags;
  if(f.powered)return 'The rec terminal is live.';
  if(f.cell)return 'Objective: take the power cell to the rec room terminal, south of the corridor.';
  if(f.talked)return 'Objective: find a power cell. The drone mentioned Cabin 03, on the north wall.';
  return 'Objective: look around. The cleaning drone might know something.';
}
const TARGETS=[['poster','Poster'],['porthole','Porthole'],['note','Note'],['photo','Photo'],['bunk','Bunk'],['locker','Locker']];
function refreshUI(){
  elMore.hidden=true;elMenu.innerHTML='';elMenu.className='';S.focus=0;
  if(S.mode==='explore'){
    elWho.textContent='';elLine.className='tw-line dim';elLine.textContent=objective();
  }else if(S.mode==='scene'){
    elWho.textContent=S.scene==='bridge'?'BRIDGE':'CABIN 03';elLine.className='tw-line dim';elLine.style.minHeight='0';
    elLine.textContent='Pick a command, then a target.';
    elMenu.className='tw-menu three';
    let h='<button class="verb" data-verb="look" aria-pressed="'+(S.verb==='look')+'">LOOK</button>'+
          '<button class="verb" data-verb="inv" aria-pressed="'+(S.verb==='inv')+'">INVESTIGATE</button>'+
          '<button class="verb" data-leave="1">LEAVE</button>';
    (S.scene==='bridge'?TARGETS_B:TARGETS).forEach(([id,name])=>{h+='<button data-t="'+id+'">'+name+'</button>';});
    elMenu.innerHTML=h;S.focus=S.verb==='look'?0:1;paintFocus();
  }else if(S.mode==='keypad'){
    elWho.textContent='LOCKER KEYPAD';elLine.className='tw-line dim';elLine.style.minHeight='0';elLine.textContent='';
    elMenu.className='kp';
    let h='<div class="kp-digits">';
    for(let i=0;i<4;i++)h+='<div class="kp-col'+(i===S.kp.sel?' sel':'')+'"><button data-kp="'+i+'" data-s="1" aria-label="Digit '+(i+1)+' up">▲</button><div class="kp-d">'+S.kp.d[i]+'</div><button data-kp="'+i+'" data-s="-1" aria-label="Digit '+(i+1)+' down">▼</button></div>';
    h+='</div><div class="kp-act"><button class="go" data-kpgo="1">ENTER</button><button data-kpback="1">BACK</button></div>';
    elMenu.innerHTML=h;
  }else if(S.mode==='starmap'){
    const sm=S.sm,dest=S.flags.dest;elLine.className='tw-line';elLine.style.minHeight='0';elMenu.className='tw-menu';
    if(sm.level==='sector'){const i=sm.sel,st=STARS[i];elWho.textContent=st.n;
      elLine.textContent=(i?smDist(i)+' light years out. ':'The Ironmonger is holding here. ')+st.d+(dest&&dest[0]===i?' The deployment target is in this system.':'');
      elMenu.innerHTML='<button data-sm="go">Enter system</button><button data-sm="back">Back to the bridge</button>';
    }else{const b=BOD[sm.sys][sm.sel];elWho.textContent=b.n+' · '+KIND[b.k];

    drawQuads(GLR.tLbl,lb,vp,[.35*a,.85*a,.85*a,1],0);
  }
  if(selPos){const se=[];bill(se,selPos,.055+.01*Math.sin(t*6));drawQuads(GLR.tGlow,se,vp,[AMB[0]*f,AMB[1]*f,AMB[2]*f,.75],0);}
  if(GLR.rays.length){const ra=[],hs=[];GLR.rays.forEach(r=>{seg(ra,r.o,[r.o[0]+r.d[0]*r.len,r.o[1]+r.d[1]*r.len,r.o[2]+r.d[2]*r.len],.0015);bill(hs,r.o,.018);});
    drawQuads(GLR.tGlow,ra,vp,[.3*f,.85*f,.8*f,.5],0);drawQuads(GLR.tGlow,hs,vp,[.4*f,.9*f,.85*f,.9],0);}
  gl.disable(gl.BLEND);gl.depthMask(true);
}
function drawGL(vp,t,vw){
  const f=1-(S.fade>0?Math.ceil(S.fade*4)/4:0),white=[f,f,f,1];
  gl.enable(gl.DEPTH_TEST);gl.disable(gl.BLEND);gl.depthMask(true);
  if(S.mode==='explore'){
    const M=mmul(vp,GLR.deckM),p=S.p;
    gl.bindTexture(gl.TEXTURE_2D,GLR.tAtlas);gl.bindBuffer(gl.ARRAY_BUFFER,GLR.world);
    gl.vertexAttribPointer(0,3,gl.FLOAT,false,20,0);gl.vertexAttribPointer(1,2,gl.FLOAT,false,20,12);
    gl.uniformMatrix4fv(GLR.um,false,M);gl.uniform4fv(GLR.ut,[.8*f,.82*f,.94*f,1]);gl.uniform1f(GLR.uc,.5);gl.drawArrays(gl.TRIANGLES,0,GLR.worldN);
    const a=[];card(a,6.5,4.9,[40,0,40,48],128,64);card(a,p.x/T,p.y/T,[0,0,40,48],128,64);
    if(!dlg&&!S.fadeDir){const [tx,ty]=frontTile();if('DLWVScTRb'.includes(tile(tx,ty))){
      const cx=tx+.5,z=ty+(isWall(tile(tx,ty))?1.02:.5),yb=isWall(tile(tx,ty))?.55:1.5;
      qpush(a,[cx-.25,yb+.5,z],[cx+.25,yb+.5,z],[cx+.25,yb,z],[cx-.25,yb,z],[80,0,16,16],128,64);}}
    drawQuads(GLR.tSpr,a,M,white,.5);
    gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE);gl.depthMask(false);
    const L=LIGHTS.slice();if(S.flags.powered)L.push([9.5*T,10*T-8,70,'95,214,200',.3]);
    L.forEach(([lx,ly,r,c,al])=>{const k=c.split(',').map(n=>n/255*f),x=lx/T,z=ly/T,q=Math.min(r/T,MH-z,z,MW-x,x),b=[];
      qpush(b,[x-q,.02,z-q],[x+q,.02,z-q],[x+q,.02,z+q],[x-q,.02,z+q],[0,0,64,64],64,64);
      drawQuads(GLR.tGlow,b,M,[k[0],k[1],k[2],Math.min(1,al*1.8)],0);});
    gl.disable(gl.BLEND);gl.depthMask(true);
  }else if(S.mode==='terminal'){
    drawQuads(GLR.tPic,pic(1.7),vp,white,0);
  }else if(S.mode==='starmap'){
    // the sphere is drawn after the panel, below
  }else{
    drawQuads(GLR.tSpace,pic(4),vp,white,0);drawQuads(GLR.tShell,pic(1.7),vp,white,.5);
    drawQuads(GLR.tDesk,pic(1.5),vp,white,.5);drawQuads(GLR.tNear,pic(1.3),vp,white,.5);drawQuads(GLR.tFx,pic(1.29),vp,white,.5);
  }
  const pa=[];qpush(pa,[-.55,.23,0],[.55,.23,0],[.55,-.23,0],[-.55,-.23,0],[0,0,768,320],768,320);
  drawQuads(GLR.tPan,pa,mmul(vp,S.mode==='explore'?mT(0,.14,-1.5):mmul(mT(0,-.62,-1.2),mRX(-.45))),[1,1,1,1],0);
  if(S.mode==='starmap')drawHolo(vp,vw,t,f);
}
function xrFrame(time,frame){
  if(!xrS)return;xrS.requestAnimationFrame(xrFrame);
  const t=time/1000,dt=Math.min(.05,t-xlast||0);xlast=t;now=t;
  GLR.rays=[];
  if(S.mode==='starmap'&&!dlg&&!S.fadeDir){try{
    const settled=S.sm.z===(S.sm.level==='system'?1:0),WP=settled?smWorldPts():[];let hit=-1,ba=.06;
    for(const src of xrS.inputSources){const sp=src.targetRaySpace;if(!sp)continue;const ps=frame.getPose(sp,xrRef);if(!ps)continue;
      const m=ps.transform.matrix,o=[m[12],m[13],m[14]],d=[-m[8],-m[9],-m[10]];let len=1.6;
      WP.forEach((w,i)=>{const r=[w[0]-o[0],w[1]-o[1],w[2]-o[2]],tt=r[0]*d[0]+r[1]*d[1]+r[2]*d[2];if(tt<.03)return;
        const an=Math.hypot(r[0]-d[0]*tt,r[1]-d[1]*tt,r[2]-d[2]*tt)/tt;if(an<ba){ba=an;hit=i;len=tt;}});
      GLR.rays.push({o,d,len});
      const gp=src.gamepad,sq=gp&&gp.buttons[1]&&gp.buttons[1].pressed,key=src.handedness||'x';
      if(sq){const pv=GLR.grab[key];if(pv){const a=[pv[0]-SMC[0],pv[1]-SMC[1],pv[2]-SMC[2]],b=[o[0]-SMC[0],o[1]-SMC[1],o[2]-SMC[2]];
          const cx=[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],sl=Math.hypot(cx[0],cx[1],cx[2]),dp=a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
          if(sl>1e-7)S.sm.m=m3mul(m3rot(cx,Math.atan2(sl,dp)*2.2),S.sm.m);}
        GLR.grab[key]=o;}else delete GLR.grab[key];}
    if(hit>=0&&hit!==S.sm.sel)smSel(hit);
  }catch(e){}}
  update(dt);
  const pose=frame.getViewerPose(xrRef);if(!pose)return;
  const layer=xrS.renderState.baseLayer;gl.bindFramebuffer(gl.FRAMEBUFFER,layer.framebuffer);
  gl.clearColor(.02,.027,.047,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
  prepGL(t);
  for(const v of pose.views){const q=layer.getViewport(v);gl.viewport(q.x,q.y,q.width,q.height);const vw=v.transform.inverse.matrix;drawGL(mmul(v.projectionMatrix,vw),t,vw);}
}
vrBtn.addEventListener('click',async()=>{
  if(xrS){xrS.end();return;}
  let ses=null;
  try{
    if(!navigator.xr||!initGL())throw new Error('WebXR is not available');
    ses=await navigator.xr.requestSession('immersive-vr');
    await gl.makeXRCompatible();
    ses.updateRenderState({baseLayer:new XRWebGLLayer(ses,gl)});
    xrRef=await ses.requestReferenceSpace('local');
    ses.addEventListener('end',()=>{xrS=null;vrBtn.textContent='Enter VR';vrBtn.setAttribute('aria-pressed','false');});
    xrS=ses;xlast=0;vrBtn.textContent='Exit VR';vrBtn.setAttribute('aria-pressed','true');
    ses.requestAnimationFrame(xrFrame);
  }catch(e){
    if(ses)try{ses.end();}catch(_){ }
    if(!dlg)say([['','VR did not start in this view. Open the hosted page in the Quest browser, then press Enter VR.']]);
  }
});
function glShot(w,h){
  initGL();glc.width=w;glc.height=h;gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,w,h);
  gl.clearColor(.02,.027,.047,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);prepGL(now);
  const vw=S.mode==='explore'?mRX(.38):mRX(.12);drawGL(mmul(persp(1.25,w/h,.05,50),vw),now,vw);return glc.toDataURL();
}

/* ---------- boot ---------- */
function start(data){
  if(data&&data.flags){Object.assign(S.flags,data.flags);if(data.p){S.p.x=data.p.x;S.p.y=data.p.y;S.p.dir=data.p.dir||'down';}S.seenCabin=!!data.seenCabin;S.seenBridge=!!data.seenBridge;}
  if(!Array.isArray(S.flags.dest))S.flags.dest=null;
  S.sm.m=m3rot([1,0,0],.35);
  buildTiles();refreshUI();
  if(!(data&&data.flags))say([[F,'Deck 3. Crew quarters and the rec room.'],[F,'Nobody home.']]);
  requestAnimationFrame(frame);
  try{window.claude&&window.claude.hot&&window.claude.hot.snapshot&&window.claude.hot.snapshot(()=>({flags:S.flags,p:{x:S.p.x,y:S.p.y,dir:S.p.dir},seenCabin:S.seenCabin,seenBridge:S.seenBridge}));}catch(e){}
}
function boot(){
  const hot=window.claude&&window.claude.hot;
  if(hot&&hot.ready)hot.ready(start);else start((hot&&hot.data)||{});
}
let booted=false;const go=()=>{if(!booted){booted=true;boot();}};
if(document.fonts&&document.fonts.load){
  Promise.all([document.fonts.load('8px Silkscreen'),document.fonts.load('700 24px Silkscreen')]).then(go,go);
  setTimeout(go,1500);
}else go();
window.__ironmonger={smRot,smGo,smBack,smSel,S,say,advance,pressA,pressB,keys,glShot,refreshUI};
})();
